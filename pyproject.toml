[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "censim"
version = "1.0.0"
description = "Closed-loop simulation of data-driven newsvendor policies under endogenous demand censoring"
requires-python = ">=3.11,<3.14"
# Lower bounds only; the exact versions used for the paper are locked in uv.lock.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "xgboost>=2.0",          # reg:quantileerror needs >= 2.0
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
python-preference = "only-managed"
